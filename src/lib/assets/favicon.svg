	<path d="M18 21v22c0 3.6 6.3 6.5 14 6.5s14-2.9 14-6.5V21Z" fill="#fff" fill-opacity=".24" />
	<g clip-path="url(#sma-body)" fill="none" stroke="#fff" stroke-width="2.6" stroke-opacity=".9">
